name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest unit & component tests
        run: npm test

      - name: Install Playwright Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright e2e tests
        run: npm run test:e2e
        env:
          CI: true
          NEXT_PUBLIC_VITALS_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_VITALS_SUPABASE_URL }}
          NEXT_PUBLIC_VITALS_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_VITALS_SUPABASE_ANON_KEY }}
          VITALS_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_VITALS_SUPABASE_ANON_KEY }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
